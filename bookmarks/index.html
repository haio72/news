<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收藏 | NewsPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #242424;
            --bg-card-hover: #2a2a2a;
            --accent-primary: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.15);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border-color: #3f3f46;
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'JetBrains Mono', 'Courier New', monospace;
            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 1.5rem;
            --space-lg: 2rem;
            --space-xl: 3rem;
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 20px var(--accent-glow);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(245, 158, 11, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            width: min(1120px, calc(100% - 2rem));
            margin: 0 auto;
            padding: var(--space-lg) 0 var(--space-xl);
            position: relative;
            z-index: 1;
        }

        .header {
            padding: var(--space-xl) 0;
            text-align: center;
        }

        .logo {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            margin-top: var(--space-sm);
            color: var(--text-secondary);
            font-size: 0.82rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: var(--space-sm);
            margin-top: var(--space-md);
            flex-wrap: wrap;
        }

        .nav-link,
        .retry-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 2.3rem;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: transparent;
            color: var(--text-secondary);
            font: inherit;
            font-size: 0.75rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .nav-link:hover,
        .retry-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            box-shadow: var(--shadow-glow);
        }

        .section-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
            padding-bottom: var(--space-sm);
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-family: var(--font-display);
            font-size: clamp(1.7rem, 5vw, 2.4rem);
            line-height: 1.1;
        }

        .section-meta {
            color: var(--text-muted);
            font-size: 0.72rem;
            text-align: right;
        }

        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-md);
        }

        .bookmark-category {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: all var(--transition-normal);
        }

        .bookmark-category:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-md);
        }

        .bookmark-category-header {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .bookmark-category-icon {
            font-size: 1.2rem;
        }

        .bookmark-category-name {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--text-primary);
        }

        .bookmark-list {
            padding: var(--space-sm);
            list-style: none;
        }

        .bookmark-item {
            display: flex;
            align-items: flex-start;
            gap: var(--space-xs);
            padding: var(--space-sm);
            border-radius: 6px;
            color: inherit;
            text-decoration: none;
            transition: background var(--transition-fast);
        }

        .bookmark-item:hover {
            background: var(--bg-card-hover);
        }

        .bookmark-icon {
            margin-top: 0.2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .bookmark-content {
            min-width: 0;
        }

        .bookmark-name {
            display: block;
            margin-bottom: 0.2rem;
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 600;
        }

        .bookmark-item:hover .bookmark-name {
            color: var(--accent-primary);
        }

        .bookmark-description {
            display: block;
            color: var(--text-muted);
            font-size: 0.7rem;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .loading,
        .error {
            grid-column: 1 / -1;
            padding: var(--space-xl);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-secondary);
            text-align: center;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto var(--space-sm);
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .error-message {
            margin-bottom: var(--space-sm);
            color: var(--text-primary);
            font-family: var(--font-display);
            font-size: 1.25rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .section-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .section-meta {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">NewsPulse</h1>
            <p class="tagline">个人收藏导航</p>
            <nav class="nav" aria-label="页面导航">
                <a class="nav-link" href="/">返回首页</a>
            </nav>
        </header>

        <main>
            <div class="section-heading">
                <h2 class="section-title">常用网站</h2>
                <div class="section-meta" id="bookmarkMeta">正在加载...</div>
            </div>
            <section class="bookmarks-grid" id="bookmarksGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载收藏...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        function withCacheBuster(url) {
            const separator = url.includes('?') ? '&' : '?';
            return `${url}${separator}_np=${Date.now()}`;
        }

        function escapeHTML(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        async function loadBookmarksConfig() {
            const response = await fetch(withCacheBuster('../bookmarks.json'), { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return response.json();
        }

        function renderError(message) {
            document.getElementById('bookmarkMeta').textContent = '加载失败';
            document.getElementById('bookmarksGrid').innerHTML = `
                <div class="error">
                    <p class="error-message">无法加载收藏</p>
                    <p>${escapeHTML(message)}</p>
                    <button class="retry-btn" type="button" onclick="init()">重试</button>
                </div>
            `;
        }

        function renderBookmarks(config) {
            const categories = Array.isArray(config.categories) ? config.categories : [];
            const count = categories.reduce((total, category) => {
                return total + (Array.isArray(category.bookmarks) ? category.bookmarks.length : 0);
            }, 0);

            document.getElementById('bookmarkMeta').textContent = `${categories.length} 个分类 · ${count} 个网站`;

            if (!categories.length) {
                document.getElementById('bookmarksGrid').innerHTML = `
                    <div class="error">
                        <p class="error-message">暂无收藏网站</p>
                        <p>请在 bookmarks.json 中添加你的收藏</p>
                    </div>
                `;
                return;
            }

            document.getElementById('bookmarksGrid').innerHTML = categories.map(category => {
                const bookmarks = Array.isArray(category.bookmarks) ? category.bookmarks : [];
                return `
                    <article class="bookmark-category">
                        <div class="bookmark-category-header">
                            <span class="bookmark-category-icon">${escapeHTML(category.icon || '📁')}</span>
                            <h3 class="bookmark-category-name">${escapeHTML(category.name)}</h3>
                        </div>
                        <ul class="bookmark-list">
                            ${bookmarks.map(bookmark => `
                                <li>
                                    <a href="${escapeHTML(bookmark.url)}" target="_blank" rel="noopener noreferrer" class="bookmark-item">
                                        <span class="bookmark-icon">↗</span>
                                        <span class="bookmark-content">
                                            <span class="bookmark-name">${escapeHTML(bookmark.name)}</span>
                                            <span class="bookmark-description">${escapeHTML(bookmark.description || '')}</span>
                                        </span>
                                    </a>
                                </li>
                            `).join('')}
                        </ul>
                    </article>
                `;
            }).join('');
        }

        async function init() {
            try {
                const config = await loadBookmarksConfig();
                renderBookmarks(config);
            } catch (error) {
                console.error('加载收藏配置失败:', error);
                renderError(error.message);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
