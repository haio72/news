<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsPulse | 智能新闻聚合</title>

    <!-- Google Fonts: Playfair Display (优雅衬线) + JetBrains Mono (技术感) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           CSS VARIABLES - 设计系统核心
           ============================================ */
        :root {
            /* 配色方案：深色编辑风格 */
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #242424;
            --bg-card-hover: #2a2a2a;

            /* 强调色：琥珀金系列 */
            --accent-primary: #f59e0b;
            --accent-secondary: #d97706;
            --accent-glow: rgba(245, 158, 11, 0.15);

            /* 文字颜色 */
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;

            /* 边框与分割线 */
            --border-color: #3f3f46;
            --border-glow: rgba(245, 158, 11, 0.3);

            /* 字体 */
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'JetBrains Mono', 'Courier New', monospace;

            /* 间距系统 */
            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 1.5rem;
            --space-lg: 2rem;
            --space-xl: 3rem;

            /* 动画 */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 500ms cubic-bezier(0.4, 0, 0.2, 1);

            /* 阴影 */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px var(--accent-glow);
        }

        /* ============================================
           RESET & BASE STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景纹理效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(245, 158, 11, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* 噪点纹理 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1;
        }

        /* ============================================
           LAYOUT
           ============================================ */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-lg);
            position: relative;
            z-index: 2;
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            text-align: center;
            padding: var(--space-xl) 0;
            margin-bottom: var(--space-xl);
            position: relative;
        }

        /* 装饰线条 */
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 60px;
            background: linear-gradient(to bottom, transparent, var(--accent-primary));
        }

        .logo {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: var(--space-sm);
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInDown 0.8s ease-out;
        }

        .tagline {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: var(--space-lg);
            margin-top: var(--space-md);
            font-size: 0.75rem;
            color: var(--text-muted);
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .stat-item::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* ============================================
           CONTROLS
           ============================================ */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
            padding: var(--space-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            animation: fadeIn 0.8s ease-out 0.5s both;
        }

        .filter-group {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .filter-btn {
            font-family: var(--font-body);
            font-size: 0.75rem;
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 4px;
        }

        .filter-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .filter-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: var(--shadow-glow);
        }

        .refresh-btn {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            font-family: var(--font-body);
            font-size: 0.75rem;
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 4px;
        }

        .refresh-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .refresh-btn.rotating svg {
            animation: spin 1s linear infinite;
        }

        /* ============================================
           HOT TRENDS SECTION
           ============================================ */
        .section-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
            padding-bottom: var(--space-sm);
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .section-meta {
            color: var(--text-muted);
            font-size: 0.7rem;
            text-align: right;
        }

        .hot-section {
            margin-bottom: var(--space-xl);
            animation: fadeIn 0.8s ease-out 0.25s both;
        }

        .hot-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
            padding: var(--space-md);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(255, 255, 255, 0.02));
        }

        .hot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: var(--space-md);
        }

        .hot-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            transition: all var(--transition-normal);
            animation: fadeInUp 0.6s ease-out both;
        }

        .hot-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-md), var(--shadow-glow);
        }

        .hot-card.status-restricted {
            border-color: rgba(245, 158, 11, 0.55);
        }

        .hot-card.status-error {
            border-color: rgba(239, 68, 68, 0.6);
        }

        .hot-card-header {
            padding: var(--space-md);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-sm);
        }

        .hot-source-name {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .hot-badges {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .hot-badge {
            font-size: 0.62rem;
            padding: 0.22rem 0.45rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .hot-badge.ok {
            border-color: rgba(34, 197, 94, 0.5);
            color: #86efac;
        }

        .hot-badge.restricted {
            border-color: rgba(245, 158, 11, 0.6);
            color: var(--accent-primary);
        }

        .hot-badge.error {
            border-color: rgba(239, 68, 68, 0.6);
            color: #fca5a5;
        }

        .hot-list {
            list-style: none;
            padding: 0;
        }

        .hot-item {
            display: grid;
            grid-template-columns: 2.5rem minmax(0, 1fr);
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            border-bottom: 1px solid var(--border-color);
            transition: background var(--transition-fast);
        }

        .hot-item:last-child {
            border-bottom: none;
        }

        .hot-item:hover {
            background: var(--bg-card-hover);
        }

        .hot-rank {
            color: var(--accent-primary);
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.2;
            text-align: right;
        }

        .hot-title {
            color: var(--text-primary);
            font-family: var(--font-display);
            font-weight: 600;
            text-decoration: none;
            line-height: 1.35;
            display: block;
            overflow-wrap: anywhere;
        }

        .hot-title:hover {
            color: var(--accent-primary);
        }

        .hot-item-meta {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            margin-top: 0.35rem;
            color: var(--text-muted);
            font-size: 0.68rem;
        }

        .hot-message {
            padding: var(--space-md);
            color: var(--text-muted);
            font-size: 0.75rem;
            line-height: 1.6;
        }

        .rss-section {
            margin-top: var(--space-xl);
        }

        /* ============================================
           BOOKMARKS SECTION
           ============================================ */
        .bookmarks-section {
            margin-bottom: var(--space-xl);
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        .bookmarks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-md);
            padding-bottom: var(--space-sm);
            border-bottom: 1px solid var(--border-color);
        }

        .bookmarks-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .bookmarks-toggle {
            font-family: var(--font-body);
            font-size: 0.7rem;
            padding: 0.4rem 0.8rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 4px;
        }

        .bookmarks-toggle:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-md);
        }

        .bookmark-category {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: all var(--transition-normal);
        }

        .bookmark-category:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-md);
        }

        .bookmark-category-header {
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .bookmark-category-icon {
            font-size: 1.2rem;
        }

        .bookmark-category-name {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .bookmark-list {
            padding: var(--space-sm);
            list-style: none;
        }

        .bookmark-item {
            display: flex;
            align-items: flex-start;
            gap: var(--space-xs);
            padding: var(--space-sm);
            border-radius: 6px;
            transition: background var(--transition-fast);
            text-decoration: none;
            color: inherit;
        }

        .bookmark-item:hover {
            background: var(--bg-card-hover);
        }

        .bookmark-icon {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 0.2rem;
        }

        .bookmark-content {
            flex: 1;
            min-width: 0;
        }

        .bookmark-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
            display: block;
        }

        .bookmark-item:hover .bookmark-name {
            color: var(--accent-primary);
        }

        .bookmark-description {
            font-size: 0.7rem;
            color: var(--text-muted);
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bookmarks-collapsed .bookmarks-grid {
            display: none;
        }

        .bookmarks-collapsed .bookmarks-toggle::after {
            content: ' (展开)';
        }

        .bookmarks-toggle::after {
            content: ' (收起)';
        }

        .bookmarks-collapsed .bookmarks-toggle::after {
            content: ' (展开)';
        }

        /* ============================================
           NEWS GRID
           ============================================ */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
        }

        /* ============================================
           FEED CARD
           ============================================ */
        .feed-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: all var(--transition-normal);
            position: relative;
            animation: fadeInUp 0.6s ease-out both;
        }

        /* 悬停3D效果 */
        .feed-card {
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .feed-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow:
                var(--shadow-lg),
                var(--shadow-glow),
                0 0 0 1px var(--border-glow);
        }

        .feed-card.feed-stale {
            border-color: rgba(245, 158, 11, 0.55);
        }

        .feed-card.feed-error {
            border-color: rgba(239, 68, 68, 0.6);
        }

        .feed-header {
            padding: var(--space-md);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-sm);
            background: var(--bg-secondary);
        }

        .feed-name {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 0;
        }

        .feed-badges {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .feed-category,
        .feed-status {
            font-size: 0.65rem;
            padding: 0.25rem 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 4px;
            font-weight: 600;
        }

        .feed-category {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .feed-status {
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
        }

        .feed-status.fresh {
            border-color: rgba(34, 197, 94, 0.5);
            color: #86efac;
        }

        .feed-status.stale {
            border-color: rgba(245, 158, 11, 0.6);
            color: var(--accent-primary);
        }

        .feed-status.error {
            border-color: rgba(239, 68, 68, 0.6);
            color: #fca5a5;
        }

        .feed-description {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: var(--space-sm) var(--space-md);
            font-style: italic;
        }

        .feed-freshness {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.5rem var(--space-sm);
            padding: 0 var(--space-md) var(--space-sm);
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .freshness-item {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .freshness-label {
            color: var(--text-secondary);
        }

        .feed-error-message {
            margin: 0 var(--space-md) var(--space-sm);
            padding: 0.65rem 0.75rem;
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 6px;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.08);
            font-size: 0.7rem;
            line-height: 1.5;
        }

        .articles-list {
            padding: 0;
            list-style: none;
        }

        .article-item {
            padding: var(--space-md);
            border-bottom: 1px solid var(--border-color);
            transition: background var(--transition-fast);
            position: relative;
        }

        .article-item:last-child {
            border-bottom: none;
        }

        .article-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent-primary);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .article-item:hover {
            background: var(--bg-card-hover);
        }

        .article-item:hover::before {
            opacity: 1;
        }

        .article-title {
            display: block;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            line-height: 1.4;
            margin-bottom: var(--space-xs);
            transition: color var(--transition-fast);
        }

        .article-title:hover {
            color: var(--accent-primary);
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .article-date {
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .article-link {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            color: var(--accent-primary);
            text-decoration: none;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: gap var(--transition-fast);
        }

        .article-link:hover {
            gap: 0.5rem;
        }

        /* ============================================
           LOADING & EMPTY STATES
           ============================================ */
        .loading {
            text-align: center;
            padding: var(--space-xl);
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto var(--space-md);
        }

        .error {
            text-align: center;
            padding: var(--space-xl);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: var(--space-md);
        }

        .error-message {
            font-size: 0.875rem;
            margin-bottom: var(--space-sm);
        }

        .error-details {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-body);
        }

        /* ============================================
           FOOTER
           ============================================ */
        .footer {
            text-align: center;
            padding: var(--space-xl) 0;
            border-top: 1px solid var(--border-color);
            margin-top: var(--space-xl);
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-md);
        }

        .footer-links {
            display: flex;
            gap: var(--space-md);
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .footer-link:hover {
            color: var(--accent-primary);
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 768px) {
            .container {
                padding: var(--space-md);
            }

            .news-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                gap: var(--space-md);
                align-items: stretch;
            }

            .filter-group {
                justify-content: center;
            }

            .section-heading,
            .hot-controls {
                align-items: stretch;
                flex-direction: column;
            }

            .section-meta {
                text-align: left;
            }

            .hot-grid {
                grid-template-columns: 1fr;
            }

            .hot-card-header {
                flex-direction: column;
            }

            .hot-badges {
                justify-content: flex-start;
            }

            .feed-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .feed-badges {
                justify-content: flex-start;
            }

            .feed-freshness {
                grid-template-columns: 1fr;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
            }
        }

        /* ============================================
           UTILITY CLASSES
           ============================================ */
        .hidden {
            display: none !important;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页头 -->
        <header class="header">
            <h1 class="logo">NewsPulse</h1>
            <p class="tagline">智能新闻聚合 · 实时追踪</p>

            <div class="hot-controls">

                        <polyline points="23 4 23 10 17 10"></polyline>

                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>

            <div class="hot-grid" id="hotGrid">

        <!-- 收藏网站区域 -->
        <section class="bookmarks-section" id="bookmarksSection">
            <div class="bookmarks-header">

                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                刷新
            </button>
        </div>

        <!-- 新闻网格 -->
        <section class="rss-section">
            <div class="section-heading">
                <h2 class="section-title">
                    <span>📰</span>
                    文章订阅
                </h2>
                <div class="section-meta">RSS 适合长文章订阅，不承担实时热榜</div>
            </div>
            <main class="news-grid" id="newsGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载新闻源...</p>
                </div>

        </section>

        <!-- 页脚 -->
        <footer class="footer">
            <div class="footer-content">
                <p>© 2026 NewsPulse. 个人热榜与新闻聚合器</p>
                <div class="footer-links">
                    <a href="https://github.com" class="footer-link" target="_blank">GitHub</a>
                    <a href="#" class="footer-link" onclick="showConfigHelp(); return false;">配置帮助</a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // ============================================
        // 配置与全局变量
        // ============================================
        let allFeeds = [];
        let allArticles = {};
        let allFeedMeta = {};
        let currentCategory = 'all';
        let hotSources = [];
        let hotCurrentCategory = 'all';
        let hotSettings = {};
        let hotRefreshTimer = null;
        let appSettings = {};
        let refreshTimer = null;

        const DEFAULT_SETTINGS = {
            articlesPerFeed: 10,
            refreshInterval: 30,
            staleThresholdMinutes: 180,
            requestTimeoutMs: 12000,
            maxConcurrentRequests: 4
        };

        const DEFAULT_HOT_SETTINGS = {
            refreshInterval: 5,
            requestTimeoutMs: 10000,
            itemsPerSource: 12
        };

        // RSS 转 JSON 代理 API（解决跨域问题）
        const RSS2JSON_API = 'https://api.rss2json.com/v1/api.json?rss_url=';
        const ALLORIGINS_RAW_API = 'https://api.allorigins.win/raw?url=';
        const DEFAULT_HOT_API = 'https://newspulse-hot-api.haioae17.workers.dev/api/hot';

        // ============================================
        // 工具函数
        // ============================================
        /**
         * 格式化日期为相对时间（如"3小时前"）
         */
        function formatRelativeTime(dateString) {
            const date = new Date(dateString);
            if (Number.isNaN(date.getTime())) {
                return '未知';
            }
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) {
                return '刚刚';
            }

            if (diffMins < 60) {
                return `${diffMins}分钟前`;
            } else if (diffHours < 24) {
                return `${diffHours}小时前`;
            } else if (diffDays < 7) {
                return `${diffDays}天前`;
            } else {
                return date.toLocaleDateString('zh-CN', {
                    month: 'short',
                    day: 'numeric'
                });
            }
        }

        /**
         * 延迟执行（用于动画效果）
         */
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        /**
         * 基础 HTML 转义，避免 RSS 标题里的特殊字符破坏页面结构
         */
        function escapeHTML(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        /**
         * 给 URL 加时间戳，降低浏览器/CDN 缓存命中概率
         */
        function withCacheBuster(url) {
            try {
                const parsed = new URL(url);
                parsed.searchParams.set('_np', Date.now().toString());
                return parsed.toString();
            } catch (error) {
                const separator = url.includes('?') ? '&' : '?';
                return `${url}${separator}_np=${Date.now()}`;
            }
        }

        function formatClock(dateString) {
            if (!dateString) return '未知';
            return new Date(dateString).toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getArticleDate(article) {
            const value = article.pubDate || article.isoDate || article.published || article.updated;
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? null : date;
        }

        function normalizeArticle(article) {
            const pubDate = article.pubDate || article.isoDate || article.published || article.updated || new Date().toISOString();
            return {
                title: article.title || '未命名文章',
                link: article.link || article.guid || '#',
                pubDate,
                author: article.author || '',
                description: article.description || article.content || ''
            };
        }

        function sortArticlesByDate(articles) {
            return articles
                .map(normalizeArticle)
                .sort((a, b) => {
                    const dateA = getArticleDate(a);
                    const dateB = getArticleDate(b);
                    return (dateB ? dateB.getTime() : 0) - (dateA ? dateA.getTime() : 0);
                });
        }

        function getTextContent(node, selectors) {
            for (const selector of selectors) {
                const match = node.querySelector(selector);
                if (match && match.textContent.trim()) {
                    return match.textContent.trim();
                }
            }
            return '';
        }

        function getLinkFromEntry(entry) {
            const atomLink = entry.querySelector('link[href]');
            if (atomLink) {
                return atomLink.getAttribute('href');
            }

            const rssLink = entry.querySelector('link');
            return rssLink ? rssLink.textContent.trim() : '';
        }

        function parseRSSXML(xmlText) {
            const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
            const parserError = doc.querySelector('parsererror');
            if (parserError) {
                throw new Error('RSS XML 解析失败');
            }

            const entries = Array.from(doc.querySelectorAll('item, entry'));
            return sortArticlesByDate(entries.map(entry => ({
                title: getTextContent(entry, ['title']),
                link: getLinkFromEntry(entry),
                pubDate: getTextContent(entry, ['pubDate', 'published', 'updated', 'dc\\:date']),
                author: getTextContent(entry, ['author name', 'creator', 'dc\\:creator']),
                description: getTextContent(entry, ['description', 'summary', 'content'])
            })));
        }

        async function fetchWithTimeout(url, options = {}) {
            const controller = new AbortController();
            const requestTimeoutMs = appSettings.requestTimeoutMs || hotSettings.requestTimeoutMs || DEFAULT_SETTINGS.requestTimeoutMs;
            const timeout = setTimeout(() => controller.abort(), requestTimeoutMs);

            try {
                return await fetch(url, {
                    cache: 'no-store',
                    ...options,
                    signal: controller.signal
                });
            } finally {
                clearTimeout(timeout);
            }
        }

        async function fetchDirectRSS(url) {
            const response = await fetchWithTimeout(withCacheBuster(url));
            if (!response.ok) {
                throw new Error(`直接抓取失败 (${response.status})`);
            }

            const xmlText = await response.text();
            const articles = parseRSSXML(xmlText);
            return { articles, source: 'direct' };
        }

        async function fetchRSS2JSON(url) {
            const apiUrl = `${RSS2JSON_API}${encodeURIComponent(withCacheBuster(url))}`;
            const response = await fetchWithTimeout(apiUrl);
            if (!response.ok) {
                throw new Error(`RSS2JSON 请求失败 (${response.status})`);
            }

            const data = await response.json();
            if (data.status !== 'ok') {
                throw new Error(data.message || 'RSS2JSON 返回错误');
            }

            return {
                articles: sortArticlesByDate(data.items || []),
                source: 'rss2json'
            };
        }

        async function fetchAllOriginsRSS(url) {
            const apiUrl = `${ALLORIGINS_RAW_API}${encodeURIComponent(withCacheBuster(url))}`;
            const response = await fetchWithTimeout(apiUrl);
            if (!response.ok) {
                throw new Error(`AllOrigins 请求失败 (${response.status})`);
            }

            const xmlText = await response.text();
            return {
                articles: parseRSSXML(xmlText),
                source: 'allorigins'
            };
        }

        async function fetchWithFallbacks(url) {
            const errors = [];
            const attempts = [fetchDirectRSS, fetchRSS2JSON, fetchAllOriginsRSS];

            for (const attempt of attempts) {
                try {
                    const result = await attempt(url);
                    if (result.articles.length > 0) {
                        return result;
                    }
                    errors.push('返回 0 篇文章');
                } catch (error) {
                    errors.push(error.message);
                }
            }

            throw new Error(errors.join('；'));
        }

        function getFeedStatus(articles, error) {
            if (error) {
                return {
                    key: 'error',
                    label: '加载失败',
                    latestAt: null
                };
            }

            const latestDate = articles.reduce((latest, article) => {
                const date = getArticleDate(article);
                if (!date) return latest;
                return !latest || date > latest ? date : latest;
            }, null);

            if (!latestDate) {
                return {
                    key: 'stale',
                    label: '可能滞后',
                    latestAt: null
                };
            }

            const ageMinutes = (Date.now() - latestDate.getTime()) / 60000;
            const isStale = ageMinutes > appSettings.staleThresholdMinutes;

            return {
                key: isStale ? 'stale' : 'fresh',
                label: isStale ? '可能滞后' : '正常',
                latestAt: latestDate.toISOString()
            };
        }

        async function runWithConcurrency(items, limit, worker) {
            const queue = [...items];
            const workerCount = Math.max(1, Math.min(Number(limit) || DEFAULT_SETTINGS.maxConcurrentRequests, items.length));
            const workers = Array.from({ length: workerCount }, async () => {
                while (queue.length > 0) {
                    const item = queue.shift();
                    await worker(item);
                    await delay(100);
                }
            });

            await Promise.all(workers);
        }

        // ============================================
        // 数据获取
        // ============================================
        function getHotApiUrl() {
            const params = new URLSearchParams(window.location.search);
            const override = params.get('hotApi');
            if (override) {
                return override;
            }

            return DEFAULT_HOT_API;
        }

        async function loadHotSourcesConfig() {
            const response = await fetch(withCacheBuster('hot-sources.json'), { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`热榜配置加载失败 (${response.status})`);
            }

            return response.json();
        }

        async function fetchHotData() {
            const response = await fetchWithTimeout(withCacheBuster(getHotApiUrl()));
            if (!response.ok) {
                throw new Error(`热榜 API 请求失败 (${response.status})`);
            }

            return response.json();
        }

        /**
         * 加载 feeds.json 配置文件
         */
        async function loadFeedsConfig() {
            try {
                const response = await fetch(withCacheBuster('feeds.json'), { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const config = await response.json();
                return config;
            } catch (error) {
                console.error('加载配置文件失败:', error);
                throw error;
            }
        }

        async function fetchRSSFeed(feed) {
            const checkedAt = new Date().toISOString();
            try {
                const result = await fetchWithFallbacks(feed.rss);
                const status = getFeedStatus(result.articles, null);
                allFeedMeta[feed.name] = {
                    ...status,
                    source: result.source,
                    checkedAt,
                    error: ''
                };
                return result.articles;
            } catch (error) {
                console.error(`获取 RSS 源 ${feed.name} 失败:`, error);
                const status = getFeedStatus([], error);
                allFeedMeta[feed.name] = {
                    ...status,
                    source: 'none',
                    checkedAt,
                    error: error.message
                };
                return [];
            }
        }

        // ============================================
        // UI 渲染
        // ============================================
        /**
         * 加载收藏网站配置
         */
        async function loadBookmarksConfig() {
            try {
                const response = await fetch(withCacheBuster('bookmarks.json'), { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const config = await response.json();
                return config;
            } catch (error) {
                console.error('加载收藏配置失败:', error);
                return null;
            }
        }

        /**
         * 渲染收藏网站
         */
        function renderBookmarks(config) {
            const grid = document.getElementById('bookmarksGrid');

            if (!config || !config.categories || config.categories.length === 0) {
                grid.innerHTML = `
                    <div class="error" style="grid-column: 1 / -1;">
                        <p class="error-message">暂无收藏网站</p>
                        <p class="error-details">请在 bookmarks.json 中添加你的收藏</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = config.categories.map((category, catIndex) => `
                <div class="bookmark-category" style="animation: fadeInUp 0.6s ease-out ${catIndex * 0.1}s both;">
                    <div class="bookmark-category-header">
                        <span class="bookmark-category-icon">${category.icon || '📁'}</span>
                        <h3 class="bookmark-category-name">${category.name}</h3>
                    </div>
                    <ul class="bookmark-list">
                        ${category.bookmarks.map((bookmark, index) => `
                            <li>
                                <a href="${bookmark.url}" target="_blank" rel="noopener noreferrer" class="bookmark-item" style="animation-delay: ${index * 0.05}s;">
                                    <span class="bookmark-icon">🔗</span>
                                    <div class="bookmark-content">
                                        <span class="bookmark-name">${bookmark.name}</span>
                                        <span class="bookmark-description">${bookmark.description || ''}</span>
                                    </div>
                                </a>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `).join('');
        }

        function renderCategoryFilters() {
            const filters = document.getElementById('categoryFilters');
            const categories = [...new Set(allFeeds.map(feed => feed.category).filter(Boolean))];
            const buttons = [
                { label: '全部', value: 'all' },
                ...categories.map(category => ({ label: category, value: category }))
            ];

            if (currentCategory !== 'all' && !categories.includes(currentCategory)) {
                currentCategory = 'all';
            }

            filters.innerHTML = buttons.map(button => `
                <button class="filter-btn ${button.value === currentCategory ? 'active' : ''}" data-category="${escapeHTML(button.value)}">
                    ${escapeHTML(button.label)}
                </button>
            `).join('');
        }

        function renderHotCategoryFilters() {
            const filters = document.getElementById('hotCategoryFilters');
            const categories = [...new Set(hotSources.map(source => source.category).filter(Boolean))];
            const buttons = [
                { label: '全部', value: 'all' },
                ...categories.map(category => ({ label: category, value: category }))
            ];

            if (hotCurrentCategory !== 'all' && !categories.includes(hotCurrentCategory)) {
                hotCurrentCategory = 'all';
            }

            filters.innerHTML = buttons.map(button => `
                <button class="filter-btn ${button.value === hotCurrentCategory ? 'active' : ''}" data-category="${escapeHTML(button.value)}">
                    ${escapeHTML(button.label)}
                </button>
            `).join('');
        }

        function createHotCard(source, index) {
            const card = document.createElement('article');
            const statusKey = source.status === '正常'
                ? 'ok'
                : source.status === '可能受限'
                    ? 'restricted'
                    : 'error';
            const items = source.items || [];
            card.className = `hot-card status-${statusKey}`;
            card.dataset.category = source.category;
            card.style.animationDelay = `${index * 0.08}s`;

            const itemsHTML = items.map(item => `
                <li class="hot-item">
                    <div class="hot-rank">${escapeHTML(item.rank || '')}</div>
                    <div>
                        <a class="hot-title" href="${escapeHTML(item.url || source.homepage)}" target="_blank" rel="noopener noreferrer">
                            ${escapeHTML(item.title)}
                        </a>
                        <div class="hot-item-meta">
                            ${item.hot ? `<span>${escapeHTML(item.hot)}</span>` : ''}
                            ${item.summary ? `<span>${escapeHTML(item.summary)}</span>` : ''}
                            ${item.extra ? `<span>${escapeHTML(item.extra)}</span>` : ''}
                        </div>
                    </div>
                </li>
            `).join('');

            card.innerHTML = `
                <div class="hot-card-header">
                    <div>
                        <h3 class="hot-source-name">${escapeHTML(source.name)}</h3>
                        <div class="hot-item-meta">
                            <span>${escapeHTML(source.category || '未分类')}</span>
                            <span>检查：${formatClock(source.checkedAt)}</span>
                        </div>
                    </div>
                    <div class="hot-badges">
                        <span class="hot-badge ${statusKey}">${escapeHTML(source.status || '未知')}</span>
                        <a class="hot-badge" href="${escapeHTML(source.homepage || '#')}" target="_blank" rel="noopener noreferrer">源站</a>
                    </div>
                </div>
                ${itemsHTML ? `<ol class="hot-list">${itemsHTML}</ol>` : `<div class="hot-message">${escapeHTML(source.message || '暂无热榜数据')}</div>`}
            `;

            return card;
        }

        function renderHotGrid() {
            const grid = document.getElementById('hotGrid');
            grid.innerHTML = '';

            const visibleSources = hotSources.filter(source =>
                hotCurrentCategory === 'all' || source.category === hotCurrentCategory
            );
            const totalItems = visibleSources.reduce((sum, source) => sum + (source.items || []).length, 0);

            visibleSources.forEach((source, index) => {
                grid.appendChild(createHotCard(source, index));
            });

            if (grid.children.length === 0) {
                grid.innerHTML = `
                    <div class="error" style="grid-column: 1 / -1;">
                        <div class="error-icon">📭</div>
                        <p class="error-message">该分类暂无热榜源</p>
                        <p class="error-details">请尝试选择其他分类</p>
                    </div>
                `;
            }

            document.getElementById('hotMeta').textContent =
                `${visibleSources.length} 个热榜源 · ${totalItems} 条 · 更新于 ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
        }

        function showHotLoading() {
            const grid = document.getElementById('hotGrid');
            grid.innerHTML = `
                <div class="loading" style="grid-column: 1 / -1;">
                    <div class="loading-spinner"></div>
                    <p>正在加载实时热榜...</p>
                </div>
            `;
        }

        function showHotError(message) {
            const grid = document.getElementById('hotGrid');
            grid.innerHTML = `
                <div class="error" style="grid-column: 1 / -1;">
                    <div class="error-icon">⚠️</div>
                    <p class="error-message">热榜 API 暂不可用</p>
                    <p class="error-details">${escapeHTML(message)}</p>
                    <p class="error-details">本地预览需另启 Worker；部署到 Cloudflare 后使用同源 /api/hot。</p>
                </div>
            `;
            document.getElementById('hotMeta').textContent = '热榜接口未连接';
        }

        /**
         * 创建新闻卡片 HTML
         */
        function createFeedCard(feed, articles) {
            const card = document.createElement('div');
            const meta = allFeedMeta[feed.name] || {
                key: 'stale',
                label: '待检查',
                source: 'none',
                checkedAt: '',
                latestAt: '',
                error: ''
            };
            card.className = `feed-card feed-${meta.key}`;
            card.dataset.category = feed.category;
            card.dataset.feedName = feed.name;

            const displayArticles = articles.slice(0, appSettings.articlesPerFeed);
            const sourceLabels = {
                direct: '直连',
                rss2json: 'RSS2JSON',
                allorigins: 'AllOrigins',
                none: '无'
            };
            const articlesHTML = articles
                .slice(0, appSettings.articlesPerFeed)
                .map((article, index) => `
                    <li class="article-item" style="animation-delay: ${index * 0.1}s">
                        <a href="${escapeHTML(article.link)}" target="_blank" rel="noopener noreferrer" class="article-title">
                            ${escapeHTML(article.title)}
                        </a>
                        <div class="article-meta">
                            <span class="article-date">${formatRelativeTime(article.pubDate)}</span>
                            <a href="${escapeHTML(article.link)}" target="_blank" rel="noopener noreferrer" class="article-link">
                                阅读
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <line x1="10" y1="14" x2="21" y2="3"></line>
                                </svg>
                            </a>
                        </div>
                    </li>
                `).join('');

            card.innerHTML = `
                <div class="feed-header">
                    <h2 class="feed-name">${escapeHTML(feed.name)}</h2>
                    <div class="feed-badges">
                        <span class="feed-status ${meta.key}">${meta.label}</span>
                        <span class="feed-category">${escapeHTML(feed.category)}</span>
                    </div>
                </div>
                ${feed.description ? `<p class="feed-description">${escapeHTML(feed.description)}</p>` : ''}
                <div class="feed-freshness">
                    <div class="freshness-item"><span class="freshness-label">最新：</span>${meta.latestAt ? formatRelativeTime(meta.latestAt) : '未知'}</div>
                    <div class="freshness-item"><span class="freshness-label">检查：</span>${formatClock(meta.checkedAt)}</div>
                    <div class="freshness-item"><span class="freshness-label">通道：</span>${sourceLabels[meta.source] || meta.source}</div>
                    <div class="freshness-item"><span class="freshness-label">显示：</span>${displayArticles.length}/${articles.length}</div>
                </div>
                ${meta.error ? `<div class="feed-error-message">${escapeHTML(meta.error)}</div>` : ''}
                <ul class="articles-list">
                    ${articlesHTML || '<li class="article-item">暂无新闻</li>'}
                </ul>
            `;

            return card;
        }

        /**
         * 渲染所有新闻卡片
         */
        function renderNewsGrid() {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';

            let totalArticles = 0;

            allFeeds.forEach((feed, index) => {
                // 分类过滤
                if (currentCategory !== 'all' && feed.category !== currentCategory) {
                    return;
                }

                const articles = allArticles[feed.name] || [];
                totalArticles += articles.length;

                const card = createFeedCard(feed, articles);
                card.style.animationDelay = `${index * 0.1}s`;
                grid.appendChild(card);
            });

            if (grid.children.length === 0) {
                grid.innerHTML = `
                    <div class="error" style="grid-column: 1 / -1;">
                        <div class="error-icon">📭</div>
                        <p class="error-message">该分类暂无新闻源</p>
                        <p class="error-details">请尝试选择其他分类</p>
                    </div>
                `;
            }

            // 更新统计信息
            document.getElementById('feedCount').textContent =
                `${allFeeds.filter(f => currentCategory === 'all' || f.category === currentCategory).length} 个源`;
            document.getElementById('articleCount').textContent =
                `${totalArticles} 篇文章`;
            document.getElementById('lastUpdate').textContent =
                `更新于 ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
        }

        /**
         * 显示加载状态
         */
        function showLoading() {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = `
                <div class="loading" style="grid-column: 1 / -1;">
                    <div class="loading-spinner"></div>
                    <p>正在加载新闻源...</p>
                </div>
            `;
        }

        /**
         * 显示错误信息
         */
        function showError(message) {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = `
                <div class="error" style="grid-column: 1 / -1;">
                    <div class="error-icon">⚠️</div>
                    <p class="error-message">加载失败</p>
                    <p class="error-details">${message}</p>
                </div>
            `;
        }

        // ============================================
        // 事件处理
        // ============================================
        /**
         * 收藏网站折叠/展开切换
         */
        function handleBookmarksToggle() {
            const section = document.getElementById('bookmarksSection');
            const toggle = document.getElementById('bookmarksToggle');
            section.classList.toggle('bookmarks-collapsed');

            if (section.classList.contains('bookmarks-collapsed')) {
                toggle.textContent = '展开';
            } else {
                toggle.textContent = '收起';
            }
        }

        /**
         * 分类筛选器点击事件
         */
        function handleCategoryFilter(event) {
            if (event.target.classList.contains('filter-btn')) {
                // 更新按钮状态
                document.querySelectorAll('#categoryFilters .filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.classList.add('active');

                // 更新当前分类
                currentCategory = event.target.dataset.category;

                // 重新渲染
                renderNewsGrid();
            }
        }

        function handleHotCategoryFilter(event) {
            if (event.target.classList.contains('filter-btn')) {
                document.querySelectorAll('#hotCategoryFilters .filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.classList.add('active');
                hotCurrentCategory = event.target.dataset.category;
                renderHotGrid();
            }
        }

        /**
         * 刷新按钮点击事件
         */
        async function handleHotRefresh() {
            const btn = document.getElementById('hotRefreshBtn');
            btn.classList.add('rotating');
            btn.disabled = true;

            try {
                showHotLoading();
                await loadHotTrends();
            } finally {
                btn.classList.remove('rotating');
                btn.disabled = false;
            }
        }

        async function handleRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('rotating');
            btn.disabled = true;

            try {
                showLoading();
                await loadAllNews();
            } finally {
                btn.classList.remove('rotating');
                btn.disabled = false;
            }
        }

        /**
         * 显示配置帮助
         */
        function showConfigHelp() {
            alert(
                '📝 NewsPulse 配置帮助\n\n' +
                '1. 编辑 feeds.json 文件添加/删除新闻源\n' +
                '2. 每个源需要 name、rss、description、category 字段\n' +
                '3. 保存后刷新页面即可生效\n\n' +
                '示例：\n' +
                '{\n' +
                '  "name": "媒体名称",\n' +
                '  "rss": "https://example.com/feed",\n' +
                '  "description": "简介",\n' +
                '  "category": "Tech"\n' +
                '}'
            );
        }

        // ============================================
        // 主逻辑
        // ============================================
        function setupHotAutoRefresh() {
            if (hotRefreshTimer) {
                clearInterval(hotRefreshTimer);
                hotRefreshTimer = null;
            }

            const intervalMinutes = Number(hotSettings.refreshInterval);
            if (!intervalMinutes || intervalMinutes <= 0) {
                return;
            }

            hotRefreshTimer = setInterval(() => {
                loadHotTrends({ silent: true });
            }, intervalMinutes * 60000);
        }

        async function loadHotTrends(options = {}) {
            try {
                if (!options.silent) {
                    showHotLoading();
                }

                const config = await loadHotSourcesConfig();
                hotSettings = {
                    ...DEFAULT_HOT_SETTINGS,
                    ...(config.settings || {})
                };
                setupHotAutoRefresh();

                const data = await fetchHotData();
                hotSources = data.sources || [];
                renderHotCategoryFilters();
                renderHotGrid();
            } catch (error) {
                console.error('加载热榜失败:', error);
                showHotError(error.message);
            }
        }

        function setupAutoRefresh() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }

            const intervalMinutes = Number(appSettings.refreshInterval);
            if (!intervalMinutes || intervalMinutes <= 0) {
                return;
            }

            refreshTimer = setInterval(() => {
                loadAllNews({ silent: true });
            }, intervalMinutes * 60000);
        }

        /**
         * 加载所有新闻
         */
        async function loadAllNews(options = {}) {
            try {
                if (!options.silent) {
                    showLoading();
                }

                // 加载配置
                const config = await loadFeedsConfig();
                allFeeds = config.feeds || [];
                appSettings = {
                    ...DEFAULT_SETTINGS,
                    ...(config.settings || {})
                };
                renderCategoryFilters();
                setupAutoRefresh();
                allFeedMeta = {};

                await runWithConcurrency(allFeeds, appSettings.maxConcurrentRequests, async feed => {
                    const articles = await fetchRSSFeed(feed);
                    allArticles[feed.name] = articles;
                });

                // 渲染
                renderNewsGrid();

            } catch (error) {
                console.error('加载新闻失败:', error);
                showError(`无法加载配置文件: ${error.message}\n\n请确保 feeds.json 文件存在且格式正确。`);
            }
        }

        /**
         * 初始化应用
         */
        function init() {
            // 绑定事件
            document.getElementById('hotCategoryFilters').addEventListener('click', handleHotCategoryFilter);
            document.getElementById('hotRefreshBtn').addEventListener('click', handleHotRefresh);
            document.getElementById('categoryFilters').addEventListener('click', handleCategoryFilter);
            document.getElementById('refreshBtn').addEventListener('click', handleRefresh);
            document.getElementById('bookmarksToggle').addEventListener('click', handleBookmarksToggle);

            // 加载收藏网站
            loadBookmarksConfig().then(config => {
                renderBookmarks(config);
            });

            // 加载实时热榜
            loadHotTrends();

            // 加载新闻
            loadAllNews();
        }

        // ============================================
        // 启动应用
        // ============================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
